# Conduit Desktop — Nginx configuration
#
# Serves the Flutter web build with:
#   - SPA fallback (/* -> /index.html)
#   - WebSocket support for streaming
#   - Large attachments (images, files up to 100MB)
#   - Strong caching for versioned Flutter assets
#   - Gzip compression
#   - Security headers (XSS, clickjacking, etc.)

# Increase max body size for file uploads (Open WebUI attachments, images, docs)
client_max_body_size 100M;
client_body_buffer_size 128k;

gzip on;
gzip_types text/plain text/css application/json application/javascript \
           image/svg+xml text/markdown;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Flutter service worker / assets (versioned, cache aggressively) ----
    location ~* \.(?:js|wasm|map)$ {
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        try_files $uri =404;
    }

    # Flutter asset files (versioned by hash in filename)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # Icons
    location /icons/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # Manifest, favicon, etc.
    location = /manifest.json {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /favicon.ico { expires 1h; }
    location = /robots.txt  { expires 1h; }

    # ---- SPA fallback: everything else goes to index.html ----
    location / {
        # Try served file first, then fallback to index.html for SPA routing
        try_files $uri $uri/ /index.html;

        # HTML should not be cached aggressively
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---- Health check endpoint ----
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ---- Deny access to hidden files ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}